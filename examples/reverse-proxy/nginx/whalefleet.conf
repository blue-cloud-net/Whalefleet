# ============================================================================
# Whalefleet —— nginx 反向代理示例
# ============================================================================
#
# ## 这份配置解决什么
#
# 镜像内**只监听明文 HTTP**（:8080）。生产部署必须由前端代理终止 TLS——
# 浏览器不会把 Bearer Token 挂在明文连接上。nginx 同时负责两件后端自己不做、
# 但生产环境必须有的事：**升级到 HTTP/2** 与 **限流**。
#
# ## 三件必须配对做的事，缺一即出问题
#
#   1. 传 X-Forwarded-Proto / X-Forwarded-For
#   2. 在应用侧声明**可信代理**（ReverseProxy__KnownProxies / KnownNetworks）
#   3. 只允许反代访问应用端口（应用本身不直接对公网暴露）
#
# ### 为什么第 2 步不能省
# 应用默认**不采信** X-Forwarded-For（`ReverseProxy:Enabled=false`）。
# 因为该头可被客户端任意伪造：若无条件采信，攻击者每次换一个伪造 IP 就能
# 无限重试登录——登录限流（5 次/分钟）等于形同虚设。
#
# 但只做第 1 步会有另一个症状：**所有用户共用一个限流桶**。
# 应用看到的 TCP 对端永远是 nginx 自己的 IP，于是 5 次失败后全体用户在 1 分钟内
# 都登不进去；而只看日志会发现「限流生效了」，完全看不出问题出在 IP 上。
# 因此可信代理白名单不是「可选的安全加固」，而是启用反代后的**必填项**。
#
# ## 部署
#
#   1. 改下面三处占位：server_name、证书路径、whalefleet 的地址
#   2. cp nginx-whalefleet.conf /etc/nginx/conf.d/
#   3. 若应用在另一台机器：把它前面那层防火墙（或 compose 的 ports）改成只放行反代 IP
#   4. 在应用的环境变量里加：
#        ReverseProxy__Enabled=true
#        ReverseProxy__KnownProxies=172.18.0.2     # nginx 容器的实际地址
#      nginx 与应用同在 docker 网络时，用网段更省事：
#        ReverseProxy__KnownNetworks=172.18.0.0/16
#      ⚠️ 启动时会解析失败并拒绝启动：写错地址不会被静默忽略
#         （静默忽略的症状是「限流对所有人一起生效」，几乎无从排查）。
#      ⚠️ 不要填 0.0.0.0/0：那等于采信任何人的 X-Forwarded-For。
#
# ## 验证
#
#   curl -I https://你的域名/healthz
#   docker logs <应用容器> | grep -i forwarded   # 应能看到被采信的客户端 IP
# ============================================================================

# ---------------------------------------------------------------------------
# 限流区
#
# 为什么在反代层做：应用侧的登录限流按**用户输入的错误**计数，
# 而这里限的是**请求速率**——两者防的不是同一件事（暴力破解 vs 单 IP 刷接口）。
# ---------------------------------------------------------------------------
limit_req_zone $binary_remote_addr zone=whalefleet_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=whalefleet_api:10m rate=120r/m;

upstream whalefleet {
    # ⚠️ 应用在 compose 网络内时用服务名（socket-proxy 模式下的 service 名是 proxy），
    #    别名 proxy 是 docker network 的 DNS 自动别名；独立部署时改成 127.0.0.1:8080。
    server proxy:8080;
    keepalive 32;
}

# HTTP 只做一件事：跳 HTTPS。
# 保留它而不是直接 listen 443 的原因是**健康检查与证书续期工具**需要能走明文，
# 而业务流量一律强制 HTTPS。
server {
    listen 80;
    listen [::]:80;
    server_name whalefleet.example.com;

    # Let's Encrypt 的 HTTP-01 验证就走这里，不能跳走
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name whalefleet.example.com;

    # ---------------- TLS ----------------
    ssl_certificate     /etc/letsencrypt/live/whalefleet.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/whalefleet.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # HSTS：告诉浏览器之后只走 HTTPS。
    # ⚠️ 加之前先确认整站（含所有子域）都已可走 HTTPS——
    #    这一行一旦下发，浏览器在 max-age 内**不会**再回落到 HTTP。
    add_header Strict-Transport-Security "max-age=31536000" always;

    # ---------------- 上传体积 ----------------
    # 容器日志与未来镜像构建（0.3.0）会走 multipart，默认 1m 太小。
    # 100m 是刻意给的上限，不是「随便设大一点」——它同时是内存与磁盘的兜底。
    client_max_body_size 100m;

    # ---------------- 安全响应头 ----------------
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    # WebSocket 与 SignalR（0.4.0 起）需要 Connection 升级，
    # 这段映射不能省——缺了它 HTTP/1.1 升级会被静默丢弃，
    # 症状是「实时日志连不上但普通接口正常」。
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ---------------- 登录限流 ----------------
    # 只限 /api/v1/auth/* ：改密码与删除用户也走同一前缀，
    # 但它们的请求量远低于登录，放宽后不影响正常操作。
    location = /api/v1/auth/login {
        limit_req zone=whalefleet_login burst=5 nodelay;

        proxy_pass http://whalefleet;
        include /etc/nginx/conf.d/whalefleet-proxy-params.inc;
    }

    # ---------------- 其余 API 限流 ----------------
    location /api/ {
        limit_req zone=whalefleet_api burst=60 nodelay;

        proxy_pass http://whalefleet;
        include /etc/nginx/conf.d/whalefleet-proxy-params.inc;
    }

    # ---------------- 前端静态资源与 SPA ----------------
    location / {
        proxy_pass http://whalefleet;
        include /etc/nginx/conf.d/whalefleet-proxy-params.inc;
    }
}
