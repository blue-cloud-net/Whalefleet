name: release-please

# 从 Conventional Commits 推导版本号并开「版本号 PR」。
#
# ## 触发时机：只在 main 上
# 合并 dev→main 的 PR 后运行——那才是「一个版本的内容已经定稿」的时刻。
# dev 上不跑：dev 的提交随时可变，在那里开 PR 会让版本号 PR 反复长大，
# 也让 tag 有可能指向一个还没合并的提交。
#
# ## 与 release.yml 的分工
#   本工作流：算版本号 + 打 tag + 建 GitHub Release（不产镜像）
#   release.yml：构建与推送镜像，只在 tag 出现时触发
#
# ## CHANGELOG.md 不由本工作流维护
# 配置里开了 skip-changelog：Release Please 只改 manifest 与前端 package.json。
# CHANGELOG 小节由人在**这个版本号 PR 里**手写（双语），
# 理由是「合并该 PR 的那一瞬间 tag 就产生了」——没有「先合并、后补写」的窗口。
#
# 刻意**不**在本工作流里构建镜像：PR 会频繁开关，每次都构建既慢又费配额，
# 而镜像是否可构建由 ci.yml 的 build 阶段保证。
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches: [main]
  # 正式发布前（如改了 skip-changelog 之类需要立刻重算）可手动触发；
  # 日常发版只需合并 dev→main，本触发点不是必需路径。
  workflow_dispatch:

jobs:
  release-please:
    name: 计算版本号并开发布 PR
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          # Release Please 需要完整历史来推导「上次发布到本次之间的变更」，
          # shallow clone 会让它误判成「没有变更」而静默不开 PR。
          fetch-depth: 0

      - name: 运行 Release Please
        uses: googleapis/release-please-action@v5
        with:
          config-file: .github/release-please-config.json
          manifest-file: .github/release-please-manifest.json
          token: ${{ secrets.GITHUB_TOKEN }}

      # ---- 守卫：0.x 不推 GHCR ----
      # 本项目只有 1.x 对外发布；0.x 全程是内部迭代期。
      # 这里把「manifest 仍停在 0.x」显式报出来，避免「自动化一切正常」
      # 却根本没有可发布产物的情况被忽略——此时开出的 PR 不应合并。
      - name: 检查 manifest 版本
        if: always()
        run: |
          version=$(jq -r '.packages["."]' .github/release-please-manifest.json)
          echo "manifest 版本：${version}"
          if [[ "${version}" == 0.*.* ]]; then
            echo "::notice::当前处于 0.x（${version}），属于内部开发迭代期。该版本的 tag 不会推送 GHCR，PR 也无需合并。首个对外版本是 v1.0.0（先出 rc）。"
          fi