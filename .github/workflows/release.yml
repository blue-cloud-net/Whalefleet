name: release

# 构建镜像并推送 GHCR —— **仅**在 Release Please 打上 tag 后触发。
#
# ## 为什么 tag 触发而不是 workflow_dispatch
# tag 是「版本已定」的不可变事实。让 tag 成为唯一触发点，可保证推上去的镜像
# 对应的提交一定是已经过测试的那一个——该提交先经 dev→main 的 PR 过完 CI，
# 再由 Release Please 打 tag。
#
# ⚠️ 推 tag 本身**不重跑** CI：同一时刻的 push 与 tag 是两个事件，
#    而 tag 事件的上下文里 CI 未必已出结论。真正的门是前一次 PR。
#
# ## 只有 1.x 对外发布
# 0.x 是内部迭代期（含已完成的 0.0.1–0.0.15 与开发中的 0.1.0–0.8.0）：
# 未正式发布、API 可能破坏性变更、不值得占用户的镜像仓库空间。
# 这个判断放在 job 内部（而非取消触发条件），
# 是因为「不推」本身也要留下一条可查的记录——
# 否则排查「为什么某个 tag 没有镜像」时什么都看不到。
# （0.x 实际不打 tag，这条分支是防御性的：万一有人手工打了 tag，别静默推出去。）
#
# ## 候选版（1.0.0-rc.N）推 GHCR，但不打 latest
# RC 是对外灰度，需要能被 `docker pull ...:1.0.0-rc.1` 拉到；
# 但绝不能覆盖 latest——那会让按 latest 部署的人提前吃到未验证版本。
#
# ## GitHub Release 不在本文件创建
# 由 Release Please 独占（见 release-please.yml）。

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  # ⚠️ 不能写成 ${{ github.repository }}：仓库名是 `Whalefleet`（含大写），
  #    而 Docker 镜像引用必须全小写，GHCR 会以
  #    "invalid reference format: repository name must be lowercase" 拒绝推送。
  IMAGE_NAME: ${{ github.repository_owner }}/whalefleet

jobs:
  build-and-push:
    name: 构建并推送镜像
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # 版本判定与镜像标签在这里一次算完。刻意不写成几个并列的 `if`：
      # 「哪些标签能推」是发布策略的唯一事实源，分散到多个 step 必然漂移。
      - name: 解析版本号并计算镜像标签
        id: version
        env:
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
        run: |
          tag="${GITHUB_REF_NAME}"                 # v1.0.0 / v1.0.0-rc.1
          version="${tag#v}"                      # 1.0.0 / 1.0.0-rc.1
          image="${REGISTRY}/${IMAGE_NAME}"

          if [[ "${version}" == 0.*.* ]]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::${tag} 属于 0.x 内部迭代期，不推送 GHCR。这是有意为之：未正式发布、API 可能破坏性变更。首个对外版本是 v1.0.0。"
            exit 0
          fi

          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

          if [[ "${version}" == *-rc.* ]]; then
            # 候选版：只给两个精确版本号。不推 `1.0`（会被误当成稳定版），
            # 也不推 `latest`（按 latest 部署的人不该吃到未验证版本）。
            echo "image_tags<<EOF" >> "$GITHUB_OUTPUT"
            echo "${image}:${version}" >> "$GITHUB_OUTPUT"
            echo "${image}:${tag}" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
            echo "::notice::${tag} 是发布候选版：推 GHCR 但不打 latest。"
            exit 0
          fi

          # 正式版：v 前缀 + 裸版本 + 主次版本 + latest
          base="${version%%-*}"
          minor="${base#*.}"; minor="${minor%%.*}"
          echo "image_tags<<EOF" >> "$GITHUB_OUTPUT"
          echo "${image}:${version}" >> "$GITHUB_OUTPUT"
          echo "${image}:${tag}" >> "$GITHUB_OUTPUT"
          echo "${image}:${base%%.*}.${minor}" >> "$GITHUB_OUTPUT"
          echo "${image}:latest" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: checkout
        if: steps.version.outputs.publish == 'true'
        uses: actions/checkout@v7

      - name: 登录 GHCR
        if: steps.version.outputs.publish == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 设置 Buildx
        if: steps.version.outputs.publish == 'true'
        uses: docker/setup-buildx-action@v4

      # 构建并推送。不推 sha —— 每次发版都是 semver，latest 已足够定位当前版本。
      # 标签集合由上一步算出：正式版四个，候选版两个。
      - name: 构建并推送
        if: steps.version.outputs.publish == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.version.outputs.image_tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 冒烟测试
        if: steps.version.outputs.publish == 'true'
        run: |
          # 在推 GHCR **之前**验证镜像可启动。
          # 推上去才发现起不来，等于把一个坏版本发布给了所有人——
          # 而 GHCR 的 tag 一旦推送就已被引用，撤回只会制造混乱。
          docker run --detach --name smoke \
            -e ADMIN__USER=admin \
            -e ADMIN__PASSWORD='SmokeTestP@ssw0rd!' \
            -e JWT__SECRET='smoke-test-secret-key-0123456789abcdefghij' \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}"

          echo "等待启动（首次运行要建库与引导管理员）…"
          for i in $(seq 1 30); do
            if curl --fail --silent --output /dev/null http://localhost:8080/healthz; then
              echo "✓ 健康检查通过"
              break
            fi
            if [[ $i -eq 30 ]]; then
              echo "::error::容器 150 秒内未通过健康检查"
              docker logs smoke
              exit 1
            fi
            sleep 5
          done

          # 前端必须真的能打开：没有这一步，一个只带后端的镜像也能通过上面的检查。
          curl --fail --silent http://localhost:8080/ | grep --quiet '<div id="app">'
          echo "✓ 前端首页可访问"

          # 非 root：直挂 socket 的部署形态下，容器内进程拿到 root 等于宿主机沦陷。
          uid=$(docker exec smoke id -u)
          if [[ "${uid}" == "0" ]]; then
            echo "::error::容器以 root 运行"
            exit 1
          fi
          echo "✓ 以非 root 运行（uid=${uid}）"

          docker rm --force smoke

      # ---- 刻意不在此创建 GitHub Release ----
      # GitHub Release 由 Release Please 独占：它在打 tag 的同时创建 Release，
      # 正文来自我们手写的 CHANGELOG 小节。本文件若也调 action-gh-release，
      # 后跑的会用 generate_release_notes 的自动 notes 覆盖掉那份正文，
      # 而自动 notes 装的是提交标题原文（中文），与 CHANGELOG 无关。
      # 需要把 CHANGELOG 小节同步进 Release 正文时，手工粘贴即可。